name: envoice
description: Offline-first premium invoicing for Nigerian businesses.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # State (manual providers only — no code generation)
  flutter_riverpod: ^2.6.1

  # PDF + share
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4

  # UI / utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.16
  collection: ^1.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
