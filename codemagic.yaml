workflows:
  android-web:
    name: Android & Web
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.envoice.app"
    scripts:
      - name: Ensure platform folders
        script: |
          set -e
          # Only scaffold if android app gradle is missing
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create . --project-name envoice --org com.envoice --platforms=android,web
          fi

      - name: Get dependencies
        script: |
          set -e
          flutter pub get

      - name: Generate Drift database code only
        script: |
          set -e
          # Riverpod generators removed — only Drift needs codegen.
          # Build-filter keeps this fast and avoids analyzer hangs.
          dart run build_runner build --delete-conflicting-outputs \
            --build-filter="lib/core/db/*"

      - name: Build Android APK (release)
        script: |
          set -e
          flutter build apk --release

      - name: Build Web
        script: |
          set -e
          flutter build web --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/web/**

    publishing:
      email:
        recipients:
          - fadarefolajimi67@gmail.com
        notify:
          success: true
          failure: true
