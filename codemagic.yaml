workflows:
  android:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.envoice.app"
    scripts:
      - name: Ensure platform folders
        script: |
          set -e
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create . --project-name envoice --org com.envoice --platforms=android
          fi

      - name: Fetch PDF fonts (Noto Sans with naira glyph)
        script: |
          set -e
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/NotoSans-Regular.ttf \
            "https://github.com/google/fonts/raw/main/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf"
          cp assets/fonts/NotoSans-Regular.ttf assets/fonts/NotoSans-Bold.ttf
          ls -la assets/fonts/

      - name: Get dependencies
        script: |
          set -e
          flutter pub get

      - name: Generate Drift database code only
        script: |
          set -e
          dart run build_runner build --build-filter="lib/core/db/*"

      - name: Build Android APK (release)
        script: |
          set -e
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - fadarefolajimi67@gmail.com
        notify:
          success: true
          failure: true
